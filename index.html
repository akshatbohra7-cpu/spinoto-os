const sum=(R,f)=>R.reduce((a,x)=>a+f(x),0),cpx=(s,n)=>n?s/n:0,c0=x=>x?c1(x):'—';

function growthDS(){const su=[...S.users].filter(x=>x.date&&x.total).sort((a,b)=>a.date<b.date?-1:1),rows=[];

// --- Combo chart: bars + up to 2 lines, each on its own scale ---
function exCombo(R,ser){const B=exBuckets(R),W=720,H=220,pl=8,pb=24,bw=(W-2*pl)/Math.max(1,B.length);
  const vals=ser.map(s=>B.map(b=>s.f(b))),mx=vals.map(v=>Math.max(1e-9,...v)),y=(v,i)=>H-pb-(v/mx[i])*(H-pb-14);
  const bars=B.map((b,j)=>`<g class="tb" onclick="exDay('${b.a}','${b.b}')"><rect x="${pl+j*bw}" y="0" width="${bw}" height="${H-pb}" fill="transparent"/><rect class="bv" style="opacity:.5" x="${(pl+j*bw+bw*.16).toFixed(1)}" y="${y(vals[0][j],0).toFixed(1)}" width="${Math.max(1,bw*.68).toFixed(1)}" height="${Math.max(0,H-pb-y(vals[0][j],0)).toFixed(1)}" rx="${Math.min(5,bw*.2).toFixed(1)}"/><title>${b.l}\n${ser.map((s,i)=>s.l+': '+s.fmt(vals[i][j])).join('\n')}</title></g>`).join('');
  const lines=ser.slice(1).map((s,k)=>`<polyline fill="none" stroke="${s.c}" stroke-width="2.5" stroke-linejoin="round" points="${vals[k+1].map((v,j)=>(pl+j*bw+bw/2).toFixed(1)+','+y(v,k+1).toFixed(1)).join(' ')}" style="pointer-events:none"/>`).join('');
  const ticks=B.length<2?[0]:[0,Math.floor((B.length-1)/2),B.length-1];
  return`<div class="chw"><svg viewBox="0 0 ${W} ${H-pb}" preserveAspectRatio="none" class="trend">${bars}${lines}</svg><div class="tk2">${ticks.map(i=>`<span>${B[i].l}</span>`).join('')}</div></div>
  <div class="lg" style="display:flex;flex-wrap:wrap;margin-top:4px">${ser.map((s,i)=>`<span style="display:inline-flex;align-items:center;gap:6px;margin-right:12px"><i style="display:inline-block;width:12px;height:${i?3:10}px;border-radius:3px;background:${i?s.c:'var(--ac)'};opacity:${i?1:.5}"></i>${s.l} <b>${s.fmt(vals[i].reduce((a,b)=>a+b,0))}</b></span>`).join('')}</div>`}

function ctx(){const M=model();return{dataThrough:M.anchor,last7:M.c7,prev7:M.p7,daily14:M.days.slice(-14).map(d=>({d:d.d,spend:Math.round(d.spend),installs:d.inst,leads:d.lead})),adsets7d:M.ads.map(a=>({name:a.name,type:a.cat,spend:Math.round(a.sp7),results:a.res7,costPerResult:+a.cost.toFixed(1),signal:a.v,why:a.why,fatigue:a.fat})),wallet:{balance:Math.round(M.bal),runwayDays:M.runway&&+M.runway.toFixed(1)},month:{adSpend:Math.round(M.mr.spend),projectedSpend:Math.round(M.proj.spend),projectedInstalls:Math.round(M.proj.inst),goals:M.g,nonAds:M.nonAds,prSpend:Math.round(M.prSpend)},healthScore:M.score,experiments:S.experiments.map(e=>({h:e.hyp,status:e.status,metric:e.metric,note:e.note})),orders:orderStats(),appGrowth:growthStats()}}
const AI=async()=>{if(window.claude)return await claude.use('sample');msg('AI features need an Anthropic API key wired in — ask Claude to add this once you want it live.');return null};
async function doBrief(){const s=await AI();if(!s||busy)return;busy=true;brief='Thinking…';render();
  try{await s(SYS+"\n\nWrite today's marketing brief: 1) what happened, 2) up to 3 actions for today, 3) one risk.\n\nDATA:"+JSON.stringify(ctx()),{cache:false,onText:({text})=>{brief=text;const e=$('#brief');if(e)e.innerHTML=md(text)}})}catch(e){brief='⚠ '+(e.message||e.code)}busy=false;render()}
async function askQ(q){q=q||val('q');if(!q||busy)return;const s=await AI();if(!s)return;busy=true;chat.push({role:'user',content:q},{role:'assistant',content:'Thinking…'});tab='ask';closeAll();render();
  const t=chat.slice(0,-1).map(m=>({...m}));t[0].content=SYS+'\n\n'+t[0].content;t[t.length-1].content+='\n\nCURRENT DATA:'+JSON.stringify(ctx());
  try{await s(t,{cache:false,onText:({text})=>{chat[chat.length-1].content=text;const e=$('#last');if(e)e.innerHTML=md(text)}})}catch(e){chat[chat.length-1].content='⚠ '+(e.message||e.code)}busy=false;render()}
async function smart(){const t=val('sm');if(!t)return;const s=await AI();if(!s)return;msg('Reading…');
  try{const j=await s.json(`Extract ad numbers from this text. Adsets: ${JSON.stringify(S.adsets.map(a=>a.name))}. Return ONLY JSON {"adset":exact name from list or null,"results":number|null,"spent":number|null,"impressions":number|null,"reach":number|null,"date":"YYYY-MM-DD"|null}. Numbers are cumulative as typed; expand "98k" to 98000. Text: ${t}`,{cache:false});
    const set=(id,v)=>{if(v!=null&&$('#'+id))$('#'+id).value=v};set('e_adset',j.adset);set('e_res',j.results);set('e_spent',j.spent);set('e_imp',j.impressions);set('e_reach',j.reach);set('e_date',j.date);hint();msg('Filled — check and Save')}catch(e){msg('Could not read that: '+(e.message||e.code))}}
const dt=v=>typeof v==='number'?new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10):(typeof v==='string'&&/^\d{4}-\d{2}-\d{2}/.test(v)?v.slice(0,10):null);
async function doImport(f){try{const wb=XLSX.read(await f.arrayBuffer()),R=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}):[];let n=0;const tick=()=>{if(++n%20===0)msg('Importing… '+n)};
  const seenObj=new Set();
  for(const r of R('Adsets').slice(1)){const name=norm(r[0]);if(!name)continue;const cat=norm(r[2])||'Other';if(!OBJ_BASE.includes(cat))seenObj.add(cat);await put('adsets',slug(name),{name,notes:norm(r[1]),category:cat,platform:norm(r[3])||'Meta',link:norm(r[4])});tick()}
  for(const o of seenObj){await put('objectives',slug(o),{name:o})}
  for(const r of R('Daily Entry').slice(1)){const d=dt(r[0]),a=norm(r[1]);if(!d||!a||typeof r[4]!=='number')continue;await put('entries',d+'_'+slug(a),{date:d,adset:a,results:+r[2]||0,cpr:+r[3]||0,spent:r[4],impressions:+r[5]||0,reach:+r[6]||0});tick()}
  for(const [i,r] of R('Wallet Tracker').entries()){const d=dt(r[0]);if(!d||typeof r[1]!=='number')continue;await put('wallet',d+'_r'+i,{date:d,amount:r[1],note:norm(r[2])});tick()}
  for(const [i,r] of R('Marketing Expense Tracker').entries()){const d=dt(r[0]);if(!d||typeof r[4]!=='number')continue;const desc=norm(r[2]);await put('expenses',d+'_r'+i,{date:d,type:desc.toLowerCase()==='pr'?'PR':'Non-Ads',category:norm(r[1]),desc,vendor:norm(r[3]),amount:r[4]});tick()}
  for(const r of R('App Users').slice(1)){const d=dt(r[0]);if(!d||typeof r[1]!=='number')continue;await put('users',d,{date:d,total:r[1]});tick()}
  for(const r of R('App Downloads _ Ratings').slice(5)){const d=dt(r[0]);if(!d)continue;await put('store',d,{date:d,ios:+r[1]||0,and:+r[2]||0,iosR:+r[3]||0,iosC:+r[4]||0,andR:+r[5]||0,andC:+r[6]||0});tick()}
  for(const [i,r] of R('App Orders').slice(1).entries()){const name=norm(r[0]);if(!name)continue;await put('orders','imp_'+i,{name,contact:norm(r[1]),date:dt(r[2]),joined:dt(r[3]),vehicle:norm(r[4]),booking:norm(r[5]),items:norm(r[6]),location:norm(r[7]),area:norm(r[8])});tick()}
  msg('Import done — '+n+' rows');go('home')}catch(e){msg('Import failed: '+(e.message||e))}}
async function exp(kind){const d=window.claude?await claude.use('downloads'):window.SpinotoRuntime;let data,filename;
  if(kind==='csv'){data=['date,adset,type,results_cum,spent_cum,daily_spend,daily_results,impressions,reach'].concat(calc().filter(x=>x.real).map(x=>[x.date,'"'+x.adset+'"',x.cat,x.results,x.spent,x.rs.toFixed(2),x.rr,x.impressions,x.reach].join(','))).join('\n');filename='spinoto-entries.csv'}else{data=JSON.stringify(S,null,1);filename='spinoto-backup.json'}
  try{await d.save({filename,data})}catch(e){if(e.code!=='declined')msg('Could not save: '+(e.message||e.code))}}
async function init(){render();
  if(window.claude){db=await claude.use('db')}
  else if(window.SPINOTO_CONFIG && window.SPINOTO_CONFIG.SUPABASE_URL && window.supabase){
    const client=window.supabase.createClient(window.SPINOTO_CONFIG.SUPABASE_URL, window.SPINOTO_CONFIG.SUPABASE_ANON_KEY);
    window.SB=client;if(!await authGate(client))return;db=window.SpinotoRuntime.makeSupaDB(client);
  }
  if(!db){msg('Database not connected — check supabase-config.js');return}
  Object.keys(S).forEach(k=>db.collection(k).onSnapshot(sn=>{S[k]=sn.docs.map(x=>({id:x.id,...x.data()}));render()},e=>msg('Sync error: '+(e.message||e.code))))}
init();
